# MySQL credentials are supplied through the environment and never committed.
spring.application.name=barberia
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_barberia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=api_barber
spring.datasource.password=DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Update the existing schema during development; use versioned migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.show-sql=true
